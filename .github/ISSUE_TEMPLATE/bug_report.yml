name: 🐛 缺陷报告
description: 报告页面异常、构建失败或功能不符合预期
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题。请尽量填写完整，这能帮我更快定位。

        提交前请先搜索一下 [已有 Issue](https://github.com/jarodchen/flog/issues)，避免重复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰地描述遇到的问题
      placeholder: 影集页面滚动到第三屏后图片不再加载……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 我需要照着做一遍才能看到问题
      placeholder: |
        1. 打开 /yingji
        2. 向下滚动约三屏
        3. 观察图片区域
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 图片应当随滚动持续加载
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如果有控制台报错，请把完整报错贴在这里
      placeholder: 图片区域保持空白，控制台报错……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 影集 / 作品墙
        - 博客文章
        - 分类 / 标签 / 归档
        - 搜索
        - 主题 / 样式
        - 构建 / 部署
        - 其他
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、浏览器版本、Node 版本
      placeholder: Windows 11 / Chrome 127 / Node 22.5.1
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可选，界面类问题贴图会很有帮助

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我已在最新的 `main` 分支上复现过
          required: false
