name: ✨ 功能建议
description: 提出新功能或改进现有功能的想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。动手写代码前建议先在这里讨论一下，避免方向不一致白做工。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说问题，再说方案。描述你遇到的实际困扰
      placeholder: 影集照片一多，想找某一张只能一直翻，没法按拍摄年份快速定位……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它变成什么样
      placeholder: 在作品墙顶部加一条时间轴，点击年份直接跳到对应位置
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 可选。说明为什么最终倾向于上面那个方案

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 影集 / 作品墙
        - 博客文章
        - 分类 / 标签 / 归档
        - 搜索
        - 主题 / 样式
        - 构建 / 部署
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。参考实现、设计稿、其他站点的类似效果等

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 Pull Request 来实现这个功能
          required: false
